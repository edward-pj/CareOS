schema-version = 1

[package]
id = "com.careos.vega"
title = "CareOS"
version = "0.1.0"
icon = "@image/app_icon.png"

# Required as of Vega SDK 0.24. The /com.amazon.vega.os@IVega_* module entries are generated from this
# table; run `vega project update-manifest --os-min 1.2 --os-version 1.2` instead of editing them by hand.
[os.version]
min = "1.2"
target = "1.2"

# Dev only: lets the app reach careos-server on http://localhost:8787 through reverse port forwarding
# (`vega device start-port-forwarding --port 8787 --forward false`). Production must use HTTPS, so
# remove this section for release builds. Documented for WebView; native XHR behaviour is unverified.
[network-traffic-policy.cleartext]
allowed-domains = ["localhost"]

[components]
[[components.interactive]]
id = "com.careos.vega.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
categories = ["com.amazon.category.main"]
launch-type = "singleton"

[processes]
[[processes.group]]
component-ids = ["com.careos.vega.main"]

[offers]
[[offers.interaction]]
id = "com.careos.vega.main"
